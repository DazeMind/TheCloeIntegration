<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente SII</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; height: 100vh; display: flex; flex-direction: column; }
  .chatbot { display: flex; flex-direction: column; height: 100vh; background: #fff; }
  .chatbot-header { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .chatbot-avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .chatbot-header h3 { font-size: 15px; font-weight: 600; margin: 0; }
  .chatbot-status { font-size: 12px; color: #86efac; }
  .chatbot-reset { margin-left: auto; background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .chatbot-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; max-width: 85%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot .bubble { background: #f3f4f6; color: #1f2937; }
  .msg.user .bubble { background: #6366f1; color: white; }
  .typing .bubble { display: flex; gap: 4px; padding: 14px 16px; }
  .typing .bubble span { width: 7px; height: 7px; background: #9ca3af; border-radius: 50%; animation: typing 1.4s infinite; }
  .typing .bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing .bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
  .chatbot-form { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #e5e7eb; }
  .chatbot-form input { flex: 1; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 24px; font-size: 14px; outline: none; }
  .chatbot-form button { width: 42px; height: 42px; border-radius: 50%; background: #6366f1; color: white; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="chatbot">
  <div class="chatbot-header">
    <div class="chatbot-avatar">🤖</div>
    <div>
      <h3>Asistente SII</h3>
      <span class="chatbot-status">● En línea</span>
    </div>
    <button class="chatbot-reset" onclick="resetChat()">Reiniciar</button>
  </div>
  <div class="chatbot-messages" id="messages"></div>
  <form class="chatbot-form" id="chatForm">
    <input type="text" id="userInput" placeholder="Escribe tu pregunta..." autocomplete="off" required>
    <button type="submit">➤</button>
  </form>
</div>
<script>
  const SESSION_ID = "{{ session_id }}";
  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('userInput');
  addMessage('bot', '¡Hola! 👋 Pregúntame sobre el SII y boletas de honorarios.');
  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage('user', text);
    inputEl.value = '';
    const typingEl = showTyping();
    try {
      const res = await fetch('/chatbot/api/chat/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: SESSION_ID })
      });
      const data = await res.json();
      typingEl.remove();
      addMessage('bot', data.reply || ('❌ ' + (data.error || 'Error')));
    } catch (err) {
      typingEl.remove();
      addMessage('bot', '❌ Error: ' + err.message);
    }
  });
  async function resetChat() {
    if (!confirm('¿Reiniciar?')) return;
    await fetch('/chatbot/api/reset/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID })
    });
    messagesEl.innerHTML = '';
    addMessage('bot', '🔄 Reiniciado.');
  }
  function addMessage(sender, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + sender;
    msg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function showTyping() {
    const t = document.createElement('div');
    t.className = 'msg bot typing';
    t.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(t);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return t;
  }
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
