<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ChatBot Demo</title>
<style>
  body { font-family: sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; margin: 0; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
  h1 { font-size: 28px; margin-bottom: 12px; color: #6366f1; }
  p { color: #6b7280; margin-bottom: 16px; }
  .chat-iframe-wrapper { width: 100%; height: 600px; border-radius: 16px; overflow: hidden; border: 1px solid #e5e7eb; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🤖 ChatBot con Gemini + Django</h1>
    <p>Pregúntale al asistente sobre el SII y boletas de honorarios.</p>
    <div class="chat-iframe-wrapper">
      <iframe src="{% url 'chatbot:widget' %}" title="Asistente SII"></iframe>
    </div>
  </div>
</div>
</body>
</html>
